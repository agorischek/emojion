name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

  consumer:
    name: Consumer (Node ${{ matrix.node }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - '10.24.1'
          - '12.22.12'
          - '14.21.3'
          - '16.20.2'
          - '18.20.8'
          - '20.19.5'
          - '22.x'
          - '24.x'
          - '26.x'

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build package with current Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Pack package
        id: pack
        run: |
          package_file="$(npm pack --json | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => console.log(JSON.parse(input)[0].filename));")"
          echo "filename=$package_file" >> "$GITHUB_OUTPUT"

      - name: Set up consumer Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Test installed package
        env:
          PACKAGE_FILE: ${{ steps.pack.outputs.filename }}
        run: |
          consumer_dir="$(mktemp -d)"
          cd "$consumer_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-package-lock "$GITHUB_WORKSPACE/$PACKAGE_FILE"
          node "$GITHUB_WORKSPACE/test/consumer-smoke.cjs" "$consumer_dir/node_modules/emj"
